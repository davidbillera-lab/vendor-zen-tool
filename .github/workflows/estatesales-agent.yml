name: EstateSales Photo Upload Agent

on:
  # Triggered automatically by the Supabase edge function via the GitHub API
  repository_dispatch:
    types: [run-estatesales-agent]

  # Also allows manual runs from the GitHub Actions UI for testing
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from estatesales_jobs table (uuid)'
        required: true

jobs:
  upload:
    name: Upload Photos to estatesales.net
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: doa-listing-agent/estatesales-agent/package-lock.json

      - name: Install agent dependencies
        working-directory: doa-listing-agent/estatesales-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: doa-listing-agent/estatesales-agent
        run: npx playwright install chromium --with-deps

      - name: Run EstateSales agent
        working-directory: doa-listing-agent/estatesales-agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_GMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
        run: node agent.js --job-id $JOB_ID

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: estatesales-screenshots-${{ github.run_id }}
          path: doa-listing-agent/estatesales-agent/logs/screenshots/
          if-no-files-found: ignore
          retention-days: 7
