name: DOA Listing Agent

on:
  # Triggered automatically by the Supabase edge function via the GitHub API
  repository_dispatch:
    types: [run-doa-agent]

  # Also allows manual runs from the GitHub Actions UI for testing
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'What triggered this run (e.g. batch name or "manual")'
        required: false
        default: 'manual'

jobs:
  fill-doa:
    name: Fill DOA Lots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: doa-listing-agent/package-lock.json

      - name: Install agent dependencies
        working-directory: doa-listing-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: doa-listing-agent
        run: npx playwright install chromium --with-deps

      - name: Run DOA agent
        working-directory: doa-listing-agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DOA_EMAIL: ${{ secrets.DOA_EMAIL }}
          DOA_PASSWORD: ${{ secrets.DOA_PASSWORD }}
        run: node runAgent.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doa-agent-screenshots
          path: doa-listing-agent/screenshots/
          if-no-files-found: ignore
          retention-days: 7
